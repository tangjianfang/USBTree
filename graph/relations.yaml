# USBTree 知识图谱 · 关系边表
# 每条边四要素：from / type / to / evidence（知识树中陈述该关系的文档，validate.sh 校验存在性）
# 关系类型词汇表（保持克制，新增类型需先在此登记）：
#   part-of       组成关系（子协议 ∈ 协议族）
#   carries       承载（某通道/端点/协议承载另一协议的数据）
#   runs-on       运行于（协议栈上下层）
#   uses          使用（机制/传输类型的消费方）
#   specifies     规定（规范定义机制）
#   reuses        跨传输/跨协议复用（关键嫁接点）
#   supersedes    取代（代际或产业更替）
#   enables       使能（没有它就不可能）
#   prerequisite  前置（运行前必须完成的树干流程）
#   tunnels       隧道化（USB4 特有承载方式）
#   similar-to    对照（语义相近便于迁移理解）
#   extends       扩展演进（向后兼容的能力延伸）

