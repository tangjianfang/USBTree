name: site

# 构建 USBTree 静态站点（Astro Starlight，site/）并检查内链。
# - PR：构建 + 内链检查（Starlight links-validator + site/scripts/check_links.py，0 断链才通过）。
# - main：同上，若仓库 Settings → Secrets 配置了 CLOUDFLARE_API_TOKEN（Account › Cloudflare Pages › Edit）
#   与 CLOUDFLARE_ACCOUNT_ID，再部署到 Cloudflare Pages（项目 usbtree → https://usbtree.gumuhub.com）；
#   未配置时只构建 + 检查，不部署。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 每页“更新于”取自 git log
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 构建站点（生成正文 → Astro → Pagefind 中文索引）
        run: npm run build
      - name: 检查内链（0 断链）
        run: python3 scripts/check_links.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 7
      - name: 部署到 Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >
          npx --yes wrangler@4 pages deploy dist --project-name=usbtree --branch=main
          --commit-hash="${GITHUB_SHA::7}" --commit-message="site @${GITHUB_SHA::7}"
