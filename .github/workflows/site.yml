name: site

# 构建 USBTree 静态站点（MkDocs Material）并检查内链。
# 自动部署到 Cloudflare Pages（项目 usbtree → https://usbtree.gumuhub.com）需要在仓库
# Settings → Secrets 中配置 CLOUDFLARE_API_TOKEN（权限：Account › Cloudflare Pages › Edit）
# 和 CLOUDFLARE_ACCOUNT_ID；未配置时只构建 + 检查，不部署。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 MkDocs Material + jieba
        run: python3 -m pip install --disable-pip-version-check -r tools/site/requirements.txt
      - name: 构建站点并检查内链（0 断链）
        run: bash tools/site/build.sh --check
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
      - name: 部署到 Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: >
          npx --yes wrangler@4 pages deploy _site --project-name=usbtree --branch=main
          --commit-hash="${GITHUB_SHA::7}" --commit-message="site @${GITHUB_SHA::7}"
