    title: 设备类代码与 HID 速查
    description: bDeviceClass / bInterfaceClass 总表、HID 键值（Usage ID）与 HID 类请求。
    blocks:
      - { file: 90-附录/02-速查表大全.md, match: '^7\)' }
      - { file: 90-附录/02-速查表大全.md, match: '^8\)' }
  - id: power-pd
    title: 供电与 PD 速查
    description: PD 固定电压档与功率、PD 核心定时器、时序参数。
